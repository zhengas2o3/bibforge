[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bibforge"
version = "0.1.0"
description = "A small, dependency-free BibTeX toolkit: parse, check, deduplicate, format, search and summarise .bib files."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ruizhao Zheng"}
]
keywords = ["bibtex", "bibliography", "latex", "references", "cli"]

[project.scripts]
bibforge = "bibforge.cli:main"

[tool.setuptools]
packages = ["bibforge"]
